<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de Inglés — Plan de 5 días</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1f2328; --muted:#6b7280;
    --line:#e5e2dc; --accent:#c2603b; --accent-soft:#fdf1ec;
    --good:#1a7f4b; --good-soft:#eaf7f0; --bad:#b42318; --bad-soft:#fdecea;
    --blue:#2f5d8a; --blue-soft:#eef4fa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;}
  .wrap{max-width:860px;margin:0 auto;padding:24px 18px 80px}
  header h1{font-size:26px;margin:0 0 4px}
  header p{margin:0;color:var(--muted);font-size:15px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 8px;position:sticky;top:0;
    background:var(--bg);padding:10px 0;z-index:20;border-bottom:1px solid var(--line)}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .dot{font-size:11px;opacity:.75;margin-left:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin:14px 0}
  .goal{background:var(--accent-soft);border-color:#f0d9cf}
  h2{font-size:20px;margin:22px 0 6px}
  h3{font-size:16px;margin:0 0 8px}
  .es{margin:0 0 6px}
  .en{margin:0;color:var(--muted);font-size:14.5px;font-style:italic}
  .ex{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .exline{display:flex;align-items:flex-start;gap:8px;font-size:15px}
  .spk{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;
    padding:2px 7px;font-size:14px;line-height:1.4;flex-shrink:0}
  .spk:hover{background:var(--accent-soft);border-color:var(--accent)}
  .gloss{color:var(--muted);font-size:13.5px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;
    background:var(--blue-soft);border:1px solid #dbe6f0;border-radius:12px;padding:10px 14px}
  .toolbar label{display:flex;gap:6px;align-items:center}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .prow:last-child{border-bottom:none}
  .prow .txt{flex:1;min-width:200px}
  .prow .txt small{display:block;color:var(--muted);font-style:italic}
  .mic{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;padding:2px 7px;font-size:14px}
  .mic.rec{background:var(--bad-soft);border-color:var(--bad)}
  .verdict{font-size:13px;min-width:70px}
  .q{margin:0 0 10px;font-weight:600}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:9px 12px;margin:6px 0;font-size:15px;cursor:pointer;font-family:inherit}
  .opt:hover{border-color:var(--accent)}
  .opt.right{background:var(--good-soft);border-color:var(--good);font-weight:600}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
  .why{display:none;margin-top:10px;background:var(--good-soft);border-left:3px solid var(--good);
    padding:10px 12px;border-radius:0 8px 8px 0;font-size:14.5px}
  .why.show{display:block}
  .score{font-size:14px;color:var(--muted);margin-top:12px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;
    font-size:14px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .note{font-size:13.5px;color:var(--muted);background:#fff8ee;border:1px solid #f0e2c8;
    border-radius:10px;padding:10px 12px;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  th{background:#f5f3ef;font-weight:600}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Práctica de Inglés — Plan de 5 días</h1>
  <p>Para Hellen · Lee la regla, escucha la frase, repítela en voz alta, y luego responde el quiz.</p>
</header>

<div class="toolbar">
  <strong>🔊 Audio:</strong>
  <label>Velocidad
    <input type="range" id="rate" min="0.5" max="1.1" step="0.05" value="0.85">
    <span id="rateVal">0.85×</span>
  </label>
  <label>Voz <select id="voiceSel"></select></label>
  <button class="btn ghost" id="testVoice">Probar</button>
</div>
<div class="note" id="audioNote">Si no escuchas nada, abre este archivo en <strong>Google Chrome</strong> y haz clic en cualquier parte de la página primero. El micrófono (🎤) solo funciona en Chrome.</div>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

</div>
<script>
/* ------------------------------------------------------------------ DATA */
const DAYS = [
{
  id:1,
  title:"Día 1",
  short:"Día 1 · do / play / go + los sentidos",
  goal:"Hoy dominas dos cosas: qué verbo va con cada actividad (do, play, go) y los verbos de los sentidos (look, smell, taste, sound, feel) que van seguidos de un adjetivo.",
  rules:[
    {es:"<strong>PLAY</strong> se usa con juegos y deportes que tienen reglas, equipos o pelota.",
     en:"Use PLAY with games and competitive sports.",
     ex:["I play chess every night.","Do you like to play board games?","She plays tennis on Saturdays.","They play soccer after school."]},
    {es:"<strong>DO</strong> se usa con actividades individuales, ejercicio sin pelota y obligaciones.",
     en:"Use DO with individual activities, exercise and duties.",
     ex:["I do yoga every day.","He does karate on Mondays.","I have to do my homework.","She does exercise before work."]},
    {es:"<strong>GO</strong> + verbo terminado en <strong>-ing</strong>: actividades a las que te desplazas.",
     en:"Use GO + -ing for activities you travel to do.",

    {es:"Verbos de los sentidos (<strong>look, smell, taste, sound, feel</strong>) van seguidos de un <strong>adjetivo</strong>, no de un adverbio. Describen cómo se percibe algo.",

  phrases:[
    ["I do yoga every day.","Hago yoga todos los días."],
    ["Do you like to play board games?","¿Te gusta jugar juegos de mesa?"],

    ["Your soccer uniform is dirty.","Tu uniforme de fútbol está sucio."],

  quiz:[
    {q:"Lainy: How do you relax? — Eloise: I ______ yoga every day.",

    {q:"Larry: Do you like to ______ board games? — Byron: Yes, I do. How about chess?",
     o:["do","play","go","run"],a:1,
     w:"<strong>play board games.</strong> Los juegos con reglas y ganador llevan PLAY: play chess, play cards, play soccer."},
    {q:"Lincoln: Let's ______ water skiing this weekend. — Brent: OK. I love it!",
     o:["play","do","go","have"],a:2,
     w:"<strong>go water skiing.</strong> Pista clave: la palabra termina en <em>-ing</em> → siempre GO. Igual: go hiking, go swimming, go shopping."},
    {q:"Hugh: Oh, no! This milk ______ bad. We need to buy some.",
     o:["smells","taste","horrible","look"],a:0,
     w:"<strong>smells.</strong> Dos razones: (1) \"milk\" es tercera persona singular → lleva <em>-s</em>; (2) \"taste\" sin -s y \"look\" no encajan, y \"horrible\" es adjetivo, no verbo."},
    {q:"Anthony: You ______ terrible. Are you sick? — Rick: Yes, I am.",

    {q:"Son: This milk smells ______! The milk was good until March 12th. It's March 15th.",

    {q:"Mother: You need to change your clothes because your soccer uniform is ______.",
     o:["cook","dirty","busy","buy"],a:1,
     w:"<strong>dirty</strong> (sucio) es el único adjetivo de la lista; \"cook\" y \"buy\" son verbos y \"busy\" (ocupado) no describe ropa."}
  ]
},
{
  id:2,
  title:"Día 2",
  short:"Día 2 · Pronombres y peticiones",
  goal:"Hoy aprendes a elegir entre pronombres de sujeto y de objeto (I/me, he/him…), y a hacer peticiones e invitaciones corteses.",
  rules:[
    {es:"<strong>Pronombres sujeto</strong> (hacen la acción): I, you, he, she, it, we, they. <strong>Pronombres objeto</strong> (reciben la acción): me, you, him, her, it, us, them.",
     en:"Subject pronouns do the action; object pronouns receive it.",
     ex:["I called him.","He called me.","We saw them at the park.","They helped us."]},
    {es:"Regla práctica: <strong>después de un verbo o de una preposición</strong> (to, for, with, at, about) siempre va el pronombre objeto.",
     en:"After a verb or a preposition, use the object pronoun.",
     ex:["Please show him the code.","He gave it to me.","This is for her.","Come with us."]},
    {es:"Cuidado: <strong>its</strong> es posesivo (su, de ello) y no se usa como objeto. <strong>It's</strong> con apóstrofo = it is.",
     en:"'Its' is possessive; 'it's' means 'it is'.",
     ex:["The dog wagged its tail.","It's cold today."]},
    {es:"<strong>Peticiones de permiso:</strong> Could I…? / Can I…? / May I…? — Siempre en forma de pregunta: auxiliar + sujeto + verbo base.",
     en:"Asking permission: Could/Can/May I…?",
     ex:["Mom, could I go to Lisa's house?","Can I use your phone?","May I come in?"]},

     en:"Invitations: Would you like to + verb.",
     ex:["Would you like to go with me to the museum?","Would you like to have coffee?","No, thanks. My knee hurts."]},
    {es:"<strong>Preguntas con palabra interrogativa</strong> en pasado: What/Where/When + <strong>did</strong> + sujeto + <strong>verbo base</strong>.",
     en:"Wh- questions in the past: did + base verb.",
     ex:["What did you do when you were in Paris?","Where did she go?","When did they arrive?"]}
  ],
  phrases:[
    ["Mom, could I go to Lisa's house?","Mamá, ¿podría ir a casa de Lisa?"],
    ["Would you please show him the confirmation code?","¿Podrías por favor mostrarle el código de confirmación?"],
    ["Yes, he gave it to me.","Sí, me la dio a mí."],
    ["Would you like to go with me to the museum?","¿Te gustaría ir conmigo al museo?"],
    ["No, thanks. My knee hurts today.","No, gracias. Me duele la rodilla hoy."],
    ["What did you do when you were in Paris?","¿Qué hiciste cuando estabas en París?"],
    ["I went up the Eiffel Tower. The view was amazing!","Subí a la Torre Eiffel. ¡La vista era increíble!"]
  ],
  quiz:[
    {q:"Daughter: Mom, ______ to Lisa's house? — Mother: OK, but just for an hour.",
     o:["walk","I can go","I don't walk","could I go"],a:3,
     w:"<strong>could I go.</strong> Hay signo de interrogación, así que necesitas forma de pregunta: modal + sujeto + verbo. \"I can go\" es afirmación, no pregunta."},
    {q:"Charles: Marla, would you please show ______ the reservation confirmation code?",
     o:["she","he","its","him"],a:3,
     w:"<strong>him.</strong> Va después del verbo \"show\", así que necesita pronombre objeto. \"She\" y \"he\" son sujeto; \"its\" es posesivo."},
    {q:"Jane: Did he give you the key? — Reese: Yes, he gave it to ______.",
     o:["me","you","we","them"],a:0,
     w:"<strong>me.</strong> Reese habla de sí mismo y va después de la preposición \"to\" → pronombre objeto <em>me</em>, no <em>I</em>."},
    {q:"Leslie: ______ with me to the museum? — Dominic: No, thanks. My knee hurts.",
     o:["aren't you go","don't you going","would you like to go","do you go"],a:2,
     w:"<strong>would you like to go.</strong> \"No, thanks\" confirma que fue una invitación. Las otras opciones están mal formadas gramaticalmente."},
    {q:"Lisel: What ______ when you were in Paris? — Mandy: I went up the Eiffel Tower.",
     o:["did you do","are you doing","can you do","do you do"],a:0,
     w:"<strong>did you do.</strong> \"when you were\" está en pasado, así que la pregunta también. Ojo: después de <em>did</em> el verbo va en base (do), sin -ed."}
  ]
},
{
  id:3,
  title:"Día 3",
  short:"Día 3 · Tiempos verbales y question tags",
  goal:"Hoy ordenas los tiempos: pasado simple, 'be going to' para planes, present perfect, y las coletillas (question tags) que suenan tan naturales en inglés.",
  rules:[
    {es:"<strong>Pasado simple:</strong> acciones terminadas. Pistas: yesterday, last week, two years ago, when I was a child.",
     en:"Past simple for finished actions.",
     ex:["Penelope showed me a photo yesterday.","I went there two years ago.","She scored two goals."]},
    {es:"<strong>be going to + verbo:</strong> planes y decisiones ya tomadas para el futuro. Negativo: am/is/are <strong>not</strong> going to.",
     en:"'be going to' for future plans.",
     ex:["She is going to travel to France.","I am not going to forget her present.","We are going to visit our grandparents."]},
    {es:"<strong>Present perfect</strong> (have/has + participio): experiencias de vida, sin decir cuándo.",
     en:"Present perfect for life experiences.",
     ex:["You've been to Spain.","I have never eaten sushi.","Have you heard about Janis and Paul?"]},
    {es:"<strong>Question tags:</strong> repite el mismo auxiliar de la frase pero con la polaridad opuesta. Frase afirmativa → coletilla negativa.",
     en:"Question tags: same auxiliary, opposite polarity.",
     ex:["You locked the door, didn't you?","You've been to Spain, haven't you?","She is your sister, isn't she?","He can't swim, can he?"]},
    {es:"Si la frase no tiene auxiliar visible (pasado simple), la coletilla usa <strong>did</strong>: <em>You locked… didn't you?</em> Si usa have/has, la coletilla usa <strong>haven't/hasn't</strong>.",
     en:"No auxiliary → use did. Present perfect → use haven't/hasn't.",
     ex:["They arrived late, didn't they?","She has finished, hasn't she?"]},
    {es:"<strong>wish + past perfect</strong> (had + participio) = arrepentimiento sobre el pasado. Para responder corto se repite el auxiliar: <em>I wonder why he didn't.</em>",
     en:"wish + past perfect expresses regret about the past.",
     ex:["Marty wishes he had passed the exam last week.","I wish I had studied more.","I wonder why he didn't."]}
  ],
  phrases:[
    ["Penelope showed me a photo of Linda and Lydia yesterday.","Penélope me mostró una foto de Linda y Lydia ayer."],
    ["Yes, she does. She is going to travel to France.","Sí, tiene planes. Va a viajar a Francia."],
    ["Don't worry. I am not going to forget to buy her a present.","No te preocupes. No voy a olvidar comprarle un regalo."],
    ["You locked the door, didn't you?","Cerraste la puerta con llave, ¿verdad?"],
    ["You've been to Spain, haven't you?","Has estado en España, ¿no?"],
    ["Marty wishes he had passed the exam last week.","Marty desearía haber aprobado el examen la semana pasada."],
    ["I wonder why he didn't.","Me pregunto por qué no lo hizo."]
  ],
  quiz:[
    {q:"Beatrice: Penelope ______ me a photo of Linda and Lydia yesterday.",
     o:["returns","showed","is checking","believed"],a:1,
     w:"<strong>showed.</strong> \"Yesterday\" exige pasado simple, y <em>show someone a photo</em> es la colocación natural para enseñar una foto."},
    {q:"Does Margaret have any plans tomorrow? — Yes, she does. She ______ to France.",

     w:"<strong>is going to travel.</strong> \"Plans tomorrow\" pide futuro con <em>be going to</em>, y \"to France\" necesita un verbo de movimiento: travel, go, fly."},
    {q:"Brother: Don't worry. I ______ to buy her a present and some flowers.",
     o:["don't remember","don't plan","am not going to remember","am not going to forget"],a:3,
     w:"<strong>am not going to forget.</strong> Está tranquilizando a su hermana: prometo que NO lo olvidaré. Las otras opciones dicen lo contrario."},
    {q:"Laura: You locked the door, ______? — Jason: Yes. Don't worry.",

     w:"<strong>didn't you.</strong> \"You locked\" es pasado simple sin auxiliar visible → la coletilla usa <em>did</em>, en negativo porque la frase es afirmativa."},
    {q:"Everett: You've been to Spain, ______? — Gia: Yes. I went there two years ago.",

    {q:"Stan: Marty wishes he ______ the exam last week. — Ellen: I wonder why he ______.",

  ]
},
{
  id:4,
  title:"Día 4",
  short:"Día 4 · Gerundio vs. infinitivo",
  goal:"Este es el tema que más aparece en tu examen. Hoy memorizas qué verbos piden -ing y cuáles piden 'to'.",
  rules:[
    {es:"<strong>Verbos que piden -ing:</strong> enjoy, suggest, admit, finish, avoid, mind, practice, keep, miss, consider, imagine.",

    {es:"Después de una <strong>preposición</strong> (after, before, without, in, of, about, for) siempre va <strong>-ing</strong>.",
     en:"After a preposition, always use -ing.",
     ex:["After finishing her work, she takes a walk.","She left without saying goodbye.","I'm interested in learning English.","Thank you for helping me."]},

     ex:["She promised to call as soon as she arrives.","I'll wait until he comes.","When she gets here, we'll eat."]}
  ],
  phrases:[

    ["She preferred to go to the art gallery uptown.","Ella prefirió ir a la galería de arte de la zona alta."],

/* ------------------------------------------------------------------ AUDIO */
let voices=[], chosen=null;
const rateEl=document.getElementById('rate'), rateVal=document.getElementById('rateVal');
const voiceSel=document.getElementById('voiceSel');
rateEl.addEventListener('input',()=>rateVal.textContent=(+rateEl.value).toFixed(2)+'×');

function loadVoices(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  voiceSel.innerHTML='';
  if(!voices.length){voiceSel.innerHTML='<option>(predeterminada)</option>';return;}
  voices.forEach((v,i)=>{
    const o=document.createElement('option');o.value=i;o.textContent=v.name.replace(/\(.*?\)/,'').trim()+' · '+v.lang;
    voiceSel.appendChild(o);
  });
  const pref=voices.findIndex(v=>/en-US/i.test(v.lang)&&/(Samantha|Google US|Ava|Jenny|Aria)/i.test(v.name));
  voiceSel.value = pref>-1?pref:0;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
else { document.getElementById('audioNote').innerHTML='Tu navegador no soporta audio. Abre este archivo en <strong>Google Chrome</strong>.'; }

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=voices[+voiceSel.value];
  if(v){u.voice=v;u.lang=v.lang;} else {u.lang='en-US';}
  u.rate=+rateEl.value;
  speechSynthesis.speak(u);
}
document.getElementById('testVoice').addEventListener('click',()=>speak("Hello Hellen. Let's practice English together."));

/* --------------------------------------------------------- PRONUNCIATION */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function norm(s){return s.toLowerCase().replace(/[^a-z\s']/g,'').replace(/\s+/g,' ').trim();}
function similarity(a,b){
  const A=norm(a).split(' '), B=norm(b).split(' ');
  const setB=new Set(B); let hit=0;
  A.forEach(w=>{if(setB.has(w))hit++;});
  return Math.round(hit/Math.max(A.length,1)*100);
}
function listenAndCompare(target,btn,out){
  if(!SR){out.textContent='(usa Chrome)';out.style.color='var(--muted)';return;}
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  btn.classList.add('rec'); out.textContent='escuchando…'; out.style.color='var(--muted)';
  r.onresult=e=>{
    let best=0,said='';
    for(let i=0;i<e.results[0].length;i++){
      const s=similarity(target,e.results[0][i].transcript);
      if(s>best){best=s;said=e.results[0][i].transcript;}
    }
    out.textContent = best>=80?'✅ '+best+'%' : best>=55?'🟡 '+best+'%' : '🔴 '+best+'%';
    out.style.color = best>=80?'var(--good)':best>=55?'#a86b00':'var(--bad)';
    out.title='Dijiste: '+said;
    btn.classList.remove('rec');
  };
  r.onerror=e=>{out.textContent = e.error==='not-allowed'?'(permite el micrófono)':'(reintenta)';btn.classList.remove('rec');};
  r.onend=()=>btn.classList.remove('rec');
  r.start();
}

/* ---------------------------------------------------------------- RENDER */
const store={
  get(k,d){try{const v=localStorage.getItem('hellen_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('hellen_'+k,JSON.stringify(v));}catch(e){}}
};
let done = store.get('done',{});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function phraseRow(en,es){
  return `<div class="prow">
    <button class="spk" data-say="${esc(en)}">🔊</button>
    <button class="mic" data-mic="${esc(en)}">🎤</button>
    <span class="verdict"></span>
    <span class="txt">${en}<small>${es}</small></span>
  </div>`;
}

function renderDay(d){
  let h=`<div class="card goal"><h3>🎯 Meta de hoy</h3><p style="margin:0">${d.goal}</p></div>`;
  h+=`<h2>1. Las reglas</h2>`;
  d.rules.forEach(r=>{
    h+=`<div class="card"><p class="es">${r.es}</p><p class="en">${r.en}</p><div class="ex">`;
    r.ex.forEach(e=>{h+=`<div class="exline"><button class="spk" data-say="${esc(e)}">🔊</button><span>${e}</span></div>`;});
    h+=`</div></div>`;
  });
  h+=`<h2>2. Escucha y repite</h2>
      <div class="card"><p style="margin:0 0 6px;font-size:14px;color:var(--muted)">
      Pulsa 🔊 para escuchar la frase. Luego pulsa 🎤 y dila en voz alta: te doy un porcentaje de acierto.</p>`;
  d.phrases.forEach(p=>h+=phraseRow(p[0],p[1]));
  h+=`</div>`;
  h+=`<h2>3. Quiz del día</h2><div class="card" id="quiz${d.id}">`;
  d.quiz.forEach((q,qi)=>{
    h+=`<div class="qblock" data-q="${qi}" style="padding:14px 0;border-bottom:1px solid var(--line)">
      <p class="q">${qi+1}. ${q.q} <button class="spk" data-say="${esc(q.q.replace(/______/g,'blank'))}">🔊</button></p>`;
    q.o.forEach((o,oi)=>{h+=`<button class="opt" data-d="${d.id}" data-q="${qi}" data-o="${oi}">${o}</button>`;});
    h+=`<div class="why">💡 ${q.w}</div></div>`;
  });
  h+=`<p class="score" id="score${d.id}">0 de ${d.quiz.length} correctas</p>
      <button class="btn ghost" data-reset="${d.id}">Reiniciar quiz</button></div>`;
  return h;
}

function renderListening(){
  let h=`<div class="card goal"><h3>🎧 ${LISTENING.title}</h3>
    <p style="margin:0">Estas son las técnicas para las preguntas de audio tipo "Sara y Lucas".</p></div><div class="card">`;
  LISTENING.tips.forEach((t,i)=>h+=`<p class="es">${i+1}. ${t[0]}</p>`);
  h+=`</div><h2>Frases típicas de esos audios</h2><div class="card">`;
  LISTENING.phrases.forEach(p=>h+=phraseRow(p[0],p[1]));
  h+=`</div>`;
  return h;
}

const tabsEl=document.getElementById('tabs'), contentEl=document.getElementById('content');
DAYS.forEach(d=>{
  const b=document.createElement('button');b.className='tab';b.dataset.day=d.id;
  b.innerHTML=d.short+' <span class="dot"></span>';
  tabsEl.appendChild(b);
});
const lb=document.createElement('button');lb.className='tab';lb.dataset.day='L';lb.textContent='🎧 Audio';
tabsEl.appendChild(lb);

function updateDots(){
  DAYS.forEach(d=>{
    const t=tabsEl.querySelector(`[data-day="${d.id}"] .dot`);
    const n=Object.keys(done[d.id]||{}).length;
    t.textContent = n===d.quiz.length?'✓':(n?n+'/'+d.quiz.length:'');
  });
}
function show(id){
  [...tabsEl.children].forEach(t=>t.classList.toggle('active',t.dataset.day==String(id)));
  contentEl.innerHTML = id==='L'?renderListening():renderDay(DAYS.find(d=>d.id==id));
  if(id!=='L'){
    const d=DAYS.find(x=>x.id==id), saved=done[id]||{};
    Object.keys(saved).forEach(qi=>{
      const blk=contentEl.querySelector(`.qblock[data-q="${qi}"]`);
      if(!blk)return;
      blk.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.o===d.quiz[qi].a)o.classList.add('right');});
      blk.querySelector('.why').classList.add('show');
    });
    updateScore(id);
  }
  window.scrollTo({top:0,behavior:'smooth'});
  store.set('last',id);
}
function updateScore(id){
  const d=DAYS.find(x=>x.id==id), s=done[id]||{};
  const ok=Object.values(s).filter(v=>v===true).length;
  const el=document.getElementById('score'+id);
  if(el)el.textContent=`${ok} de ${d.quiz.length} correctas al primer intento`;
  updateDots();
}
tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)show(t.dataset.day);});

document.addEventListener('click',e=>{
  const say=e.target.closest('[data-say]');
  if(say){speak(say.dataset.say);return;}
  const mic=e.target.closest('[data-mic]');
  if(mic){listenAndCompare(mic.dataset.mic,mic,mic.parentElement.querySelector('.verdict'));return;}
  const rs=e.target.closest('[data-reset]');
  if(rs){delete done[rs.dataset.reset];store.set('done',done);show(rs.dataset.reset);return;}
  const opt=e.target.closest('.opt');
  if(opt){
    const dId=+opt.dataset.d, qi=+opt.dataset.q, oi=+opt.dataset.o;
    const d=DAYS.find(x=>x.id===dId), q=d.quiz[qi];
    const blk=opt.closest('.qblock');
    if(blk.dataset.answered)return;
    blk.dataset.answered='1';
    blk.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.o===q.a)o.classList.add('right');});
    if(oi!==q.a)opt.classList.add('wrong');
    blk.querySelector('.why').classList.add('show');
    done[dId]=done[dId]||{}; done[dId][qi]=(oi===q.a);
    store.set('done',done);
    updateScore(dId);
  }
});

show(store.get('last',1));
</script>
